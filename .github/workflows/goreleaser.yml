name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Dispatched by release-please.yml at the tag it just created, because a tag
  # pushed with GITHUB_TOKEN does not itself start a workflow run. Always
  # dispatch this with `--ref <tag>`: goreleaser releases the checked-out
  # commit, so a run against a branch has nothing to release (see the guard
  # below). Also useful for re-running a release by hand.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fail fast and legibly on a workflow_dispatch aimed at a branch, rather
      # than logging into GHCR and letting goreleaser fail deep in the run.
      - name: Require a tag ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::This workflow releases a tag, but ref is '${GITHUB_REF}'. Re-run with --ref vX.Y.Z."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_DOCKER: 'true'
