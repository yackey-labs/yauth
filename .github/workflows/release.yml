name: Release npm packages

# Publishes the TypeScript client + UI packages (clients/packages/*) to npm.
#
# Versioning is unified with the Go module: a single `vX.Y.Z` tag triggers
# BOTH this workflow (npm) and goreleaser.yml (Go binaries + Docker), so the
# npm packages and the server release at the same version. workflow_dispatch
# (optional `version` input, defaults to the latest tag) re-runs the publish;
# already-published packages are skipped, so it safely fills in whatever a
# partial failure missed.
#
# Auth: npm OIDC **trusted publishing** (no token). The trusted-publisher
# config on npm is pinned to repo `yackey-labs/yauth` + workflow `release.yml`,
# no environment — do NOT rename this file or add an `environment:` without
# updating the npm config. (History: the yauth-go→yauth rename broke OIDC once
# because 0.14.0's provenance commit moved to yauth-rs; fixed by a one-time
# NPM_TOKEN publish of 0.23.0 to re-anchor provenance, then re-bound via
# `npm trust github`. Empty NODE_AUTH_TOKEN from setup-node blocks OIDC, hence
# the unset below.)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.24.0). Defaults to the latest git tag. Already-published packages are skipped, so this safely re-publishes only what is missing.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need tags for the latest-tag version fallback

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Recent npm for provenance attestation (and future OIDC publishing).
      # We publish with npm, not pnpm (pnpm 9.15.4 lacks provenance/OIDC).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Resolve the version to publish: from the tag (tag push), else the
      # workflow_dispatch input, else the latest git tag. INPUT_VERSION is
      # passed via env (untrusted dispatch input) and the result is validated
      # against a strict semver pattern before it touches any shell command.
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            V="${INPUT_VERSION#v}"
          else
            V="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::resolved version '$V' is not a valid semver"
            exit 1
          fi
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"
          echo "Resolved release version: $V"

      - name: Set package versions
        run: |
          echo "Setting npm package versions to ${RELEASE_VERSION}"
          pnpm -r exec -- npm version "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version

      # Regenerate the client from the committed spec so the published artifact
      # always matches this commit's openapi.json.
      - name: Generate client
        run: pnpm run generate

      - name: Build packages
        run: pnpm run build

      # Publish each package from its directory via OIDC trusted publishing.
      # --provenance attests the build via id-token. workspace:* deps are
      # substituted in-place with the concrete version first.
      # Idempotent publish: each package is skipped if its version is already on
      # the registry, so a re-run (or workflow_dispatch) after a partial failure
      # publishes only what is missing instead of aborting on the first
      # already-published package.
      # Backport dist-tag: if the version being published is older than the
      # current "latest" on the registry, use "vMAJOR.MINOR.x" instead of
      # "latest" — npm refuses to downgrade the latest pointer implicitly.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: |
          set -euo pipefail
          # setup-node leaves an empty NODE_AUTH_TOKEN in the env; even empty it
          # blocks OIDC, so unset it to let trusted publishing engage.
          unset NODE_AUTH_TOKEN || true
          VER="${RELEASE_VERSION}"
          echo "publishing version: $VER"
          for p in shared client ui-vue; do
            sed -i "s/\"workspace:\*\"/\"$VER\"/g" "packages/$p/package.json"
          done
          # Determine the dist-tag. Fall back to 0.0.0 if the package is new.
          CURRENT_LATEST=$(npm view "@yackey-labs/yauth-shared" version 2>/dev/null || echo "0.0.0")
          HIGHEST=$(printf '%s\n' "$VER" "$CURRENT_LATEST" | sort -V | tail -1)
          if [ "$HIGHEST" = "$VER" ]; then
            DIST_TAG="latest"
          else
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            DIST_TAG="v${MAJOR}.${MINOR}.x"
          fi
          echo "dist-tag: $DIST_TAG (registry latest: $CURRENT_LATEST, publishing: $VER)"
          published=0 skipped=0
          for p in shared client ui-vue; do
            pkg="@yackey-labs/yauth-$p"
            if npm view "${pkg}@${VER}" version >/dev/null 2>&1; then
              echo "::notice::${pkg}@${VER} already published — skipping"
              skipped=$((skipped+1))
              continue
            fi
            echo "::group::npm publish $p ($VER)"
            ( cd "packages/$p" && npm publish --provenance --access public --tag "$DIST_TAG" )
            echo "::endgroup::"
            published=$((published+1))
          done
          echo "published=$published skipped=$skipped"
