name: Release npm packages

# Publishes the TypeScript client + UI packages (clients/packages/*) to npm.
#
# Versioning is unified with the Go module: a single `vX.Y.Z` tag triggers
# BOTH this workflow (npm) and goreleaser.yml (Go binaries + Docker), so the
# npm packages and the server release at the same version. workflow_dispatch
# is provided for the first publish under this repo.
#
# Auth: a one-time NPM_TOKEN (secrets.NPM_TOKEN) bootstrap. The repo rename
# broke OIDC trusted publishing — the published 0.14.0 provenance points at a
# commit now in yauth-rs, so npm can't validate the trusted-publisher source.
# This publish re-anchors provenance to THIS repo; afterwards set up the
# trusted publisher (repo `yackey-labs/yauth`, workflow `release.yml`, no
# environment) and drop NODE_AUTH_TOKEN to revert to pure OIDC. Keep this file
# named release.yml so it matches the npm trusted-publisher config.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Recent npm for provenance attestation (and future OIDC publishing).
      # We publish with npm, not pnpm (pnpm 9.15.4 lacks provenance/OIDC).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing npm packages at $VERSION"
          pnpm -r exec -- npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Regenerate the client from the committed spec so the published artifact
      # always matches this commit's openapi.json.
      - name: Generate client
        run: pnpm run generate

      - name: Build packages
        run: pnpm run build

      # Publish each package from its directory with token auth; --provenance
      # still attests the build via id-token, re-anchoring provenance to this
      # repo. workspace:* deps are substituted in-place with the concrete
      # version first so consumers get a real range.
      - name: Publish to npm (token auth + provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./packages/shared/package.json').version")
          echo "publishing version: $VER"
          for p in shared client ui-vue; do
            sed -i "s/\"workspace:\*\"/\"$VER\"/g" "packages/$p/package.json"
          done
          for p in shared client ui-vue; do
            echo "::group::npm publish $p"
            ( cd "packages/$p" && npm publish --provenance --access public )
            echo "::endgroup::"
          done
