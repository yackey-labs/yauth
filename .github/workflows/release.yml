name: Release npm packages

# Publishes the TypeScript client + UI packages (clients/packages/*) to npm.
#
# Versioning is unified with the Go module: a single `vX.Y.Z` tag triggers
# BOTH this workflow (npm) and goreleaser.yml (Go binaries + Docker), so the
# npm packages and the server release at the same version. workflow_dispatch
# is provided for the first publish under this repo.
#
# Auth: npm OIDC **trusted publishing** (no token). The trusted-publisher
# config on npm is pinned to repo `yackey-labs/yauth` + workflow `release.yml`,
# no environment — do NOT rename this file or add an `environment:` without
# updating the npm config. (History: the yauth-go→yauth rename broke OIDC once
# because 0.14.0's provenance commit moved to yauth-rs; fixed by a one-time
# NPM_TOKEN publish of 0.23.0 to re-anchor provenance, then re-bound via
# `npm trust github`. Empty NODE_AUTH_TOKEN from setup-node blocks OIDC, hence
# the unset below.)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Recent npm for provenance attestation (and future OIDC publishing).
      # We publish with npm, not pnpm (pnpm 9.15.4 lacks provenance/OIDC).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing npm packages at $VERSION"
          pnpm -r exec -- npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Regenerate the client from the committed spec so the published artifact
      # always matches this commit's openapi.json.
      - name: Generate client
        run: pnpm run generate

      - name: Build packages
        run: pnpm run build

      # Publish each package from its directory via OIDC trusted publishing.
      # --provenance attests the build via id-token. workspace:* deps are
      # substituted in-place with the concrete version first.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: |
          set -euo pipefail
          # setup-node leaves an empty NODE_AUTH_TOKEN in the env; even empty it
          # blocks OIDC, so unset it to let trusted publishing engage.
          unset NODE_AUTH_TOKEN || true
          VER=$(node -p "require('./packages/shared/package.json').version")
          echo "publishing version: $VER"
          for p in shared client ui-vue; do
            sed -i "s/\"workspace:\*\"/\"$VER\"/g" "packages/$p/package.json"
          done
          for p in shared client ui-vue; do
            echo "::group::npm publish $p"
            ( cd "packages/$p" && npm publish --provenance --access public )
            echo "::endgroup::"
          done
