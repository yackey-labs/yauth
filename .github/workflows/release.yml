name: Release npm packages

# Publishes the TypeScript client + UI packages (clients/packages/*) to npm.
#
# Versioning is unified with the Go module: a single `vX.Y.Z` tag triggers
# BOTH this workflow (npm) and goreleaser.yml (Go binaries + Docker), so the
# npm packages and the server release at the same version. workflow_dispatch
# is provided for the first publish under this repo.
#
# Publishing uses npm OIDC **trusted publishing** — there is no NPM_TOKEN.
# The trusted-publisher config on npm is pinned to repo `yackey-labs/yauth`,
# workflow `release.yml`, no environment. Do not rename this file or add an
# `environment:` without updating the npm config.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      # NOTE: no `registry-url:` — it writes an `_authToken=${NODE_AUTH_TOKEN}`
      # .npmrc that pre-empts npm's OIDC trusted-publishing flow. npm defaults
      # to registry.npmjs.org and engages OIDC when no token is configured.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm OIDC trusted publishing needs npm >= 11.5.1; the bundled npm is
      # older. pnpm's own publish (9.15.4) does NOT perform the OIDC handshake,
      # so we pack with pnpm (to substitute workspace:* deps) and publish each
      # tarball with npm, which does.
      - name: Upgrade npm (trusted-publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing npm packages at $VERSION"
          pnpm -r exec -- npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Regenerate the client from the committed spec so the published artifact
      # always matches this commit's openapi.json.
      - name: Generate client
        run: pnpm run generate

      - name: Build packages
        run: pnpm run build

      # Publish each package from its directory (npm's OIDC trusted-publishing
      # detection needs the package context). workspace:* deps are substituted
      # in-place with the concrete version first so consumers get a real range.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: |
          set -euo pipefail
          echo "npm version: $(npm --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC id-token: available"
          else
            echo "OIDC id-token: MISSING (id-token:write not effective)"
          fi
          VER=$(node -p "require('./packages/shared/package.json').version")
          echo "publishing version: $VER"
          for p in shared client ui-vue; do
            sed -i "s/\"workspace:\*\"/\"$VER\"/g" "packages/$p/package.json"
          done
          for p in shared client ui-vue; do
            echo "::group::npm publish $p"
            ( cd "packages/$p" && npm publish --provenance --access public )
            echo "::endgroup::"
          done
