# Example config consumed by examples/config/main.go.
# Production note: keep `database.auto_migrate: false` and run
# `yauth migrate -c yauth.yaml` as a one-shot Job before rolling out
# app replicas. Concurrent AutoMigrate across replicas races.
database:
  driver: memory
  auto_migrate: true

server:
  addr: ":3000"
  prefix: "/api/auth"

session:
  ttl: 720h
  cookie_name: yauth_session
  cookie_secure: false
  cookie_same_site: lax

telemetry:
  enabled: false
  service_name: yauth
  otlp_endpoint: http://localhost:4317

plugins:
  email_password:
    enabled: true
    min_password_length: 12
    require_email_verification: false
