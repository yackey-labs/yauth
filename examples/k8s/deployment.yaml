# App Deployment. Roll out only AFTER the yauth-migrate Job has
# completed; NewFromConfig() does not auto-migrate, so a fresh DB will
# fail SchemaCheck and the pod will crash-loop until migrations run.
#
# Pair with migrate-job.yaml as a Helm pre-upgrade hook or run the Job
# manually before `kubectl rollout`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yauth
  labels:
    app: yauth
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yauth
  template:
    metadata:
      labels:
        app: yauth
    spec:
      containers:
        - name: yauth-app
          image: yauth-app:latest
          args: ["-c", "/etc/yauth/yauth.yaml"]
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yauth-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: yauth-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/yauth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/auth/healthz
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: yauth-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yauth-config
data:
  yauth.yaml: |
    database:
      driver: postgres
      dsn: "env:DATABASE_URL"
      auto_migrate: false   # production: NEVER enable this
    server:
      addr: ":3000"
      prefix: "/api/auth"
    session:
      ttl: 720h
      cookie_name: yauth_session
      cookie_secure: true
      cookie_same_site: lax
    plugins:
      email_password:
        enabled: true
        min_password_length: 12
      bearer:
        enabled: true
        jwt_secret_env: JWT_SECRET
        access_ttl: 15m
        refresh_ttl: 720h
        issuer: yauth
