version: "2"
sql:
  - engine: "postgresql"
    queries: "repo/pgxrepo/queries/"
    schema: "migrate/postgres/"
    gen:
      go:
        package: "pgxgen"
        out: "repo/pgxrepo/gen"
        sql_package: "pgx/v5"
        emit_db_tags: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.int2"
            go_type: "int16"
          - db_type: "pg_catalog.int4"
            go_type: "int32"
          - db_type: "pg_catalog.int8"
            go_type: "int64"
